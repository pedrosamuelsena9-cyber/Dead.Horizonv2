name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Dead.Horizon.zip
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: curl -fL -o Dead.Horizon/app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - run: cd Dead.Horizon && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: Dead.Horizon-apk, path: Dead.Horizon/app/build/outputs/apk/debug/app-debug.apk}
